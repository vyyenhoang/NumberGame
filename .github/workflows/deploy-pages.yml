name: Deploy to GitHub Pages

# Publishes the site by syncing main -> gh-pages (Pages serves the gh-pages branch).
# This only needs contents:write, which the default workflow token has.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: git push --force origin HEAD:gh-pages
